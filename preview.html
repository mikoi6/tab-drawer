<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>标签抽屉</title>
  <style>
:root {
  --bg: #ffffff;
  --bg-soft: #f6f7fb;
  --line: #ebedf5;
  --text: #16181f;
  --text-2: #5b6178;
  --muted: #8f95ab;
  --accent: #4f46e5;
  --accent-2: #6d5cff;
  --accent-soft: #eef0ff;
  --danger: #e5484d;
  --radius: 12px;
}

* { box-sizing: border-box; }

/* 浏览器默认的 [hidden]{display:none} 打不过我们自己写的 display:flex，
   所以这里强制一次，避免 JS 里 xxx.hidden = true 失效。 */
[hidden] { display: none !important; }

html, body {
  margin: 0;
  padding: 0;
}

body {
  width: 384px;
  max-height: 600px;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  color: var(--text);
  font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased;
}

button { font-family: inherit; cursor: pointer; }

/* ---------- header ---------- */
.hd {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 14px 10px;
  border-bottom: 1px solid var(--line);
}

.brand { display: flex; align-items: center; gap: 10px; }

.logo {
  width: 30px; height: 30px;
  border-radius: 9px;
  display: block;
  box-shadow: 0 2px 8px rgba(79, 70, 229, 0.28);
}

h1 {
  margin: 0;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.2px;
}

.sub {
  margin: 1px 0 0;
  font-size: 11.5px;
  color: var(--muted);
}

.icon-btn {
  width: 28px; height: 28px;
  display: grid; place-items: center;
  padding: 0;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fff;
  color: var(--text-2);
  font-size: 13px;
  line-height: 1;
  transition: 0.15s;
}
.icon-btn:hover { background: var(--bg-soft); color: var(--accent); }
.icon-btn.on { background: var(--accent-soft); border-color: #d9dcff; color: var(--accent); }

/* ---------- actions ---------- */
.actions {
  display: flex;
  gap: 8px;
  padding: 12px 14px 0;
}

.btn {
  flex: 1;
  height: 34px;
  border-radius: 10px;
  border: 1px solid transparent;
  font-size: 13px;
  font-weight: 500;
  transition: 0.15s;
}

.btn.primary {
  background: linear-gradient(135deg, var(--accent), var(--accent-2));
  color: #fff;
  box-shadow: 0 2px 10px rgba(79, 70, 229, 0.25);
}
.btn.primary:hover { filter: brightness(1.06); }
.btn.primary:disabled {
  background: #e9eaf2; color: var(--muted); box-shadow: none; cursor: not-allowed;
}

.btn.ghost {
  flex: 0 0 auto;
  padding: 0 12px;
  background: #fff;
  border-color: var(--line);
  color: var(--text-2);
}
.btn.ghost:hover { border-color: #d9dcff; color: var(--accent); background: var(--accent-soft); }

/* ---------- search ---------- */
.search { padding: 10px 14px 6px; }

.search input {
  width: 100%;
  height: 32px;
  padding: 0 10px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: var(--bg-soft);
  font-size: 12.5px;
  color: var(--text);
  outline: none;
  transition: 0.15s;
}
.search input::placeholder { color: var(--muted); }
.search input:focus {
  background: #fff;
  border-color: #c9cbff;
  box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.09);
}

/* ---------- toolbar ---------- */
.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 2px 14px 6px;
  font-size: 11.5px;
  color: var(--muted);
}
.toolbar-actions { display: flex; gap: 10px; }

.link {
  border: none;
  background: none;
  padding: 0;
  font-size: 11.5px;
  color: var(--accent);
}
.link:hover { text-decoration: underline; }
.link.danger { color: var(--danger); }
.link.armed {
  color: #fff;
  background: var(--danger);
  padding: 1px 8px;
  border-radius: 6px;
  text-decoration: none;
}

/* ---------- 视图切换 ---------- */
.segmented {
  display: flex;
  gap: 3px;
  margin: 10px 14px 0;
  padding: 3px;
  border-radius: 10px;
  background: var(--bg-soft);
}

.seg-btn {
  flex: 1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  height: 26px;
  border: none;
  border-radius: 8px;
  background: transparent;
  color: var(--text-2);
  font-size: 12.5px;
  font-weight: 500;
  transition: 0.15s;
}
.seg-btn:hover { color: var(--accent); }
.seg-btn.on {
  background: #fff;
  color: var(--accent);
  box-shadow: 0 1px 3px rgba(23, 25, 40, 0.1);
}

.badge {
  min-width: 16px;
  height: 15px;
  padding: 0 4px;
  border-radius: 999px;
  background: #e6e8f2;
  color: var(--text-2);
  font-size: 10px;
  font-weight: 600;
  line-height: 15px;
  text-align: center;
}
.seg-btn.on .badge { background: var(--accent-soft); color: var(--accent); }

/* ---------- list ---------- */
.list {
  flex: 1;
  min-height: 0;
  max-height: 318px;
  overflow-y: auto;
  padding: 0 8px 8px;
}
.list::-webkit-scrollbar { width: 8px; }
.list::-webkit-scrollbar-thumb {
  background: #dfe2ee; border-radius: 4px; border: 2px solid #fff;
}

.group-head {
  position: sticky;
  top: 0;
  z-index: 1;
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 8px 6px 4px;
  background: #fff;
  color: var(--muted);
  cursor: pointer;
  user-select: none;
}

.chev {
  flex: 0 0 12px;
  color: var(--muted);
  transition: transform 0.15s;
}

.group-favicon {
  width: 12px; height: 12px;
  flex: 0 0 12px;
  border-radius: 3px;
  object-fit: contain;
}

.group-dot {
  width: 9px; height: 9px;
  flex: 0 0 9px;
  border-radius: 50%;
}

.group-label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.3px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.group-count {
  flex: 0 0 auto;
  min-width: 15px;
  height: 14px;
  padding: 0 4px;
  border-radius: 999px;
  background: var(--bg-soft);
  font-size: 10px;
  font-weight: 600;
  line-height: 14px;
  text-align: center;
}

.group-head .bulk {
  margin-left: auto;
  flex: 0 0 auto;
}

/* ---------- 分组方式开关 ---------- */
.toolbar-left {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

.mode-toggle {
  display: flex;
  padding: 2px;
  border-radius: 7px;
  background: var(--bg-soft);
}
.mode-toggle[hidden] { display: none; }

.mode-btn {
  height: 19px;
  padding: 0 5px;
  border: none;
  border-radius: 5px;
  background: transparent;
  color: var(--muted);
  font-size: 10.5px;
  transition: 0.12s;
}
.mode-btn.on {
  background: #fff;
  color: var(--accent);
  box-shadow: 0 1px 2px rgba(23, 25, 40, 0.1);
}

.item {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 7px 8px;
  border-radius: 9px;
  cursor: pointer;
  transition: background 0.12s;
}
.item:hover { background: var(--bg-soft); }

.favicon {
  width: 16px; height: 16px;
  flex: 0 0 16px;
  border-radius: 4px;
  object-fit: contain;
}

.avatar {
  width: 16px; height: 16px;
  flex: 0 0 16px;
  display: grid; place-items: center;
  border-radius: 4px;
  background: var(--accent-soft);
  color: var(--accent);
  font-size: 9.5px;
  font-weight: 700;
  text-transform: uppercase;
}

.meta { min-width: 0; flex: 1; }

.item-title {
  font-size: 12.5px;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.item-host {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 10.5px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* 小标签：当前页 / 固定 / 已休眠 */
.tag {
  flex: 0 0 auto;
  padding: 0 4px;
  border-radius: 4px;
  background: #eef0f7;
  color: var(--text-2);
  font-size: 9.5px;
  line-height: 14px;
}
.tag.on { background: var(--accent-soft); color: var(--accent); }

/* 标签组标记：一个色点 + 组名 */
.group-chip {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  flex: 0 0 auto;
  max-width: 110px;
  padding: 0 4px 0 3px;
  border-radius: 4px;
  background: #f3f4f9;
  color: var(--text-2);
  font-size: 9.5px;
  line-height: 14px;
  overflow: hidden;
}

.group-chip .dot {
  width: 6px; height: 6px;
  flex: 0 0 6px;
  border-radius: 50%;
}

/* 「收纳」按钮：本窗标签视图里每行一个 */
.act-btn {
  flex: 0 0 auto;
  height: 22px;
  padding: 0 8px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: #fff;
  color: var(--text-2);
  font-size: 11px;
  transition: 0.12s;
}
.item:hover .act-btn { border-color: #d9dcff; color: var(--accent); }
.act-btn:hover { background: var(--accent-soft); border-color: #d9dcff; color: var(--accent); }

.del {
  flex: 0 0 auto;
  width: 22px; height: 22px;
  border: none;
  border-radius: 6px;
  background: transparent;
  color: var(--muted);
  font-size: 13px;
  line-height: 1;
  opacity: 0;
  transition: 0.12s;
}
.item:hover .del { opacity: 1; }
.del:hover { background: #ffeced; color: var(--danger); }

mark {
  background: #fff3bf;
  color: inherit;
  border-radius: 2px;
  padding: 0 1px;
}

/* ---------- empty ---------- */
.empty {
  padding: 26px 30px 32px;
  text-align: center;
}
.empty-icon { font-size: 26px; }
.empty-title {
  margin: 8px 0 4px;
  font-size: 12.5px;
  font-weight: 600;
}
.empty-desc {
  margin: 0;
  font-size: 11.5px;
  line-height: 1.6;
  color: var(--muted);
}

/* ---------- settings ---------- */
.settings {
  border-top: 1px solid var(--line);
  padding: 10px 14px 12px;
  background: var(--bg-soft);
}

.row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 0;
  font-size: 12.5px;
  color: var(--text-2);
  cursor: pointer;
}
.row.sub { padding-left: 22px; font-size: 12px; }
.row input[type="checkbox"] { accent-color: var(--accent); width: 14px; height: 14px; margin: 0; }
.row select {
  font-family: inherit;
  font-size: 12px;
  padding: 2px 6px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: #fff;
  color: var(--text);
  outline: none;
}

.hint {
  margin: 8px 0 0;
  font-size: 11px;
  line-height: 1.6;
  color: var(--muted);
}

/* ---------- toast ---------- */
.toast {
  position: fixed;
  left: 50%;
  bottom: 16px;
  transform: translateX(-50%);
  padding: 7px 14px;
  border-radius: 999px;
  background: rgba(22, 24, 31, 0.9);
  color: #fff;
  font-size: 12px;
  white-space: nowrap;
  pointer-events: none;
  animation: pop 0.18s ease-out;
}

@keyframes pop {
  from { opacity: 0; transform: translate(-50%, 6px); }
  to { opacity: 1; transform: translate(-50%, 0); }
}

  </style>

  <script>
/**
 * TabDrawer · 弹窗界面
 *
 * 结构上分三层，方便你以后替换任意一层：
 *   api      —— 数据通道。有扩展环境就走消息；没有就走内存假数据（所以这个页面
 *               单独用浏览器打开也能看到完整界面，方便调样式）。
 *   render   —— 纯展示，只读 data / ui 两个对象，不碰任何浏览器 API。
 *   handlers —— 用户操作，调 api 然后 refresh()。
 */

/* ================= 1. 环境探测 ================= */

const HAS_CHROME =
  typeof chrome !== 'undefined' && !!(chrome.runtime && chrome.runtime.id);

/* ================= 2. 数据通道 ================= */

const realApi = {
  getState: () => chrome.runtime.sendMessage({ type: 'GET_STATE' }),
  getWindowTabs: () => chrome.runtime.sendMessage({ type: 'GET_WINDOW_TABS' }),
  stashWindow: () => chrome.runtime.sendMessage({ type: 'STASH_WINDOW' }),
  stashActive: () => chrome.runtime.sendMessage({ type: 'STASH_ACTIVE' }),
  stashTabs: (tabIds) => chrome.runtime.sendMessage({ type: 'STASH_TABS', tabIds }),
  suspendAll: () => chrome.runtime.sendMessage({ type: 'SUSPEND_ALL' }),
  restore: (ids) => chrome.runtime.sendMessage({ type: 'RESTORE', ids }),
  remove: (ids) => chrome.runtime.sendMessage({ type: 'DELETE', ids }),
  clear: () => chrome.runtime.sendMessage({ type: 'DELETE_ALL' }),
  focusTab: (tabId) => chrome.runtime.sendMessage({ type: 'FOCUS_TAB', tabId }),
  saveSettings: (settings) =>
    chrome.runtime.sendMessage({ type: 'SAVE_SETTINGS', settings })
};

// 预览模式用的假数据：只为了让界面在普通网页里也能渲染出来
function createDemoApi() {
  const H = 3600 * 1000;
  const D = 24 * H;
  const now = Date.now();

  const collection = [
    { id: 'a1', title: 'Promise - JavaScript | MDN', url: 'https://developer.mozilla.org/zh-CN/docs/Web/JavaScript/Reference/Global_Objects/Promise', savedAt: now - 0.3 * H, group: { title: '前端文档', color: 'blue' } },
    { id: 'a2', title: 'chrome.tabs API 参考文档', url: 'https://developer.chrome.com/docs/extensions/reference/api/tabs', savedAt: now - 1.2 * H, group: { title: '扩展开发', color: 'green' } },
    { id: 'a3', title: '【全国大学生软件测试大赛】Web 应用测试赛项规程', url: 'https://www.example-contest.cn/rules/web', savedAt: now - 3 * H, group: { title: '测试大赛', color: 'purple' } },
    { id: 'a4', title: 'Playwright 官方文档 · Locators 定位器', url: 'https://playwright.dev/docs/locators', savedAt: now - 1 * D, group: { title: '测试大赛', color: 'purple' } },
    { id: 'a5', title: '如何用 Service Worker 处理长时间任务', url: 'https://web.dev/articles/service-workers', savedAt: now - 2 * D, group: { title: '扩展开发', color: 'green' } },
    { id: 'a6', title: '广州大学教务系统 - 选课', url: 'https://jw.gzhu.edu.cn/course/select', savedAt: now - 5 * D },
    { id: 'a7', title: 'OneTab 的产品设计思路分析', url: 'https://www.notion.so/onetab-analysis', savedAt: now - 12 * D },
    { id: 'a8', title: '知乎 · 前端如何系统地学', url: 'https://www.zhihu.com/question/1001', savedAt: now - 2 * H },
    { id: 'a9', title: '知乎 · 标签页管理插件推荐', url: 'https://www.zhihu.com/question/1002', savedAt: now - 30 * H }
  ];

/* ================= 3. 小工具 ================= */

const $ = (sel) => document.querySelector(sel);

const GROUP_COLORS = {
  grey: '#8f95ab',
  blue: '#1a73e8',
  red: '#d93025',
  yellow: '#f9ab00',
  green: '#1e8e3e',
  pink: '#d01884',
  purple: '#a142f4',
  cyan: '#12b5cb',
  orange: '#fa903e'
};

// 常见的二级后缀：判断"可注册域名"时要多看一段，否则 gzhu.edu.cn 会被切成 edu.cn
const MULTI_SUFFIX = new Set([
  'com.cn', 'net.cn', 'org.cn', 'gov.cn', 'edu.cn', 'ac.cn',
  'co.uk', 'org.uk', 'ac.uk', 'co.jp', 'ne.jp', 'or.jp',
  'com.hk', 'com.tw', 'com.au', 'co.kr', 'com.sg', 'co.nz', 'com.br'
]);

function hostOf(url) {
  try {
    return new URL(url).hostname.replace(/^www\./, '');
  } catch (_) {
    return String(url || '').slice(0, 40);
  }
}

/**
 * 站点键：把同一站点的不同页面归到一起。
 * 这不是完整的 Public Suffix List，而是一份够用的小抄——真要做到零误判，
 * 得引入完整 PSL 数据表，对个人项目来说性价比不高。
 */
function siteKeyOf(url) {
  const host = hostOf(url);
  if (!host || /^[\d.]+$/.test(host) || host === 'localhost') return host;
  const parts = host.split('.');
  if (parts.length <= 2) return host;
  const last2 = parts.slice(-2).join('.');
  if (MULTI_SUFFIX.has(last2)) return parts.slice(-3).join('.');
  return last2;
}

function bucketOf(ts) {
  const d = new Date(ts);
  const today = new Date();
  const yesterday = new Date(today.getTime() - 86400000);
  if (d.toDateString() === today.toDateString()) return '今天';
  if (d.toDateString() === yesterday.toDateString()) return '昨天';
  if (Date.now() - ts < 7 * 86400000) return '最近 7 天';
  return '更早';
}

let toastTimer = null;
function toast(text) {
  const el = $('#toast');
  el.textContent = text;
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    el.hidden = true;
  }, 1900);
}

/** 带高亮的文本节点（避免用 innerHTML 拼标题，防止标题里带 HTML 标签搞坏页面） */
function highlighted(text, keyword) {
  const frag = document.createDocumentFragment();
  if (!keyword) {
    frag.append(text);
    return frag;
  }
  const lower = text.toLowerCase();
  const k = keyword.toLowerCase();
  let from = 0;
  let idx = lower.indexOf(k);
  while (idx !== -1) {
    if (idx > from) frag.append(text.slice(from, idx));
    const mark = document.createElement('mark');
    mark.textContent = text.slice(idx, idx + k.length);
    frag.append(mark);
    from = idx + k.length;
    idx = lower.indexOf(k, from);
  }
  if (from < text.length) frag.append(text.slice(from));
  return frag;
}

function svgIcon(d, size, stroke) {
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', '0 0 24 24');
  svg.setAttribute('width', String(size));
  svg.setAttribute('height', String(size));
  svg.setAttribute('fill', 'none');
  svg.setAttribute('stroke', stroke || 'currentColor');
  svg.setAttribute('stroke-width', '2.4');
  svg.setAttribute('stroke-linecap', 'round');
  svg.setAttribute('stroke-linejoin', 'round');
  const path = document.createElementNS(ns, 'path');
  path.setAttribute('d', d);
  svg.append(path);
  return svg;
}

/* ---- 抽屉视图 ---- */

function renderDrawer() {
  const kw = ui.keyword.trim().toLowerCase();
  const items = data.collection
    .filter(
      (i) =>
        !kw ||
        i.title.toLowerCase().includes(kw) ||
        i.url.toLowerCase().includes(kw)
    )
    .sort((a, b) => b.savedAt - a.savedAt);

  $('#listCount').textContent = kw
    ? `找到 ${items.length} 项`
    : `共 ${data.collection.length} 项`;

  if (!items.length) {
    if (data.collection.length) showEmpty('没有匹配的内容', '换个关键词试试，或者清空搜索框。');
    else showEmpty('抽屉是空的', '点上面的「收进抽屉」，把这一刻不想看的标签先存起来。');
    return;
  }

  paintGroups(buildDrawerGroups(items), 'drawer');
}

/** 抽屉列表的分组：按时间桶、按站点，或按标签组 */
function buildDrawerGroups(items) {
  if (ui.groupBy === 'group') {
    const map = new Map();
    for (const it of items) {
      // 组名和颜色一起当键：同名不同色是两个组，合并会把语义搞错
      const g = it.group || null;
      const key = g ? `g:${g.color || 'grey'}|${g.title || ''}` : 'g:-';
      if (!map.has(key)) map.set(key, { group: g, items: [] });
      map.get(key).items.push(it);
    }
    return [...map.entries()]
      .sort((a, b) => {
        const aBare = !a[1].group;
        const bBare = !b[1].group;
        if (aBare !== bBare) return aBare ? 1 : -1; // 未分组永远垫底
        const byCount = b[1].items.length - a[1].items.length;
        if (byCount) return byCount;
        return (a[1].group && a[1].group.title || '').localeCompare(
          (b[1].group && b[1].group.title) || ''
        );
      })
      .map(([key, v]) => ({
        key,
        label: v.group ? v.group.title || '未命名组' : '未分组',
        dot: v.group ? GROUP_COLORS[v.group.color] || GROUP_COLORS.grey : '',
        icon: '',
        items: v.items.sort((x, y) => y.savedAt - x.savedAt)
      }));
  }

  if (ui.groupBy === 'site') {
    const map = new Map();
    for (const it of items) {
      const key = siteKeyOf(it.url);
      if (!map.has(key)) map.set(key, []);
      map.get(key).push(it);
    }
    return [...map.entries()]
      .sort((a, b) => b[1].length - a[1].length || a[0].localeCompare(b[0]))
      .map(([site, arr]) => ({
        key: 'site:' + site,
        label: site,
        icon: arr[0].favIconUrl || '',
        items: arr.sort((x, y) => y.savedAt - x.savedAt)
      }));
  }

  const map = new Map();
  for (const it of items) {
    const key = bucketOf(it.savedAt);
    if (!map.has(key)) map.set(key, []);
    map.get(key).push(it);
  }
  const order = ['今天', '昨天', '最近 7 天', '更早'];
  return [...map.entries()]
    .sort((a, b) => order.indexOf(a[0]) - order.indexOf(b[0]))
    .map(([label, arr]) => ({
      key: 'time:' + label,
      label,
      icon: '',
      items: arr.sort((x, y) => y.savedAt - x.savedAt)
    }));
}

/* ---- 本窗标签视图 ---- */

function renderTabsView() {
  const kw = ui.keyword.trim().toLowerCase();
  const tabs = data.tabs.filter(
    (t) =>
      !kw || t.title.toLowerCase().includes(kw) || t.url.toLowerCase().includes(kw)
  );

  $('#listCount').textContent = kw
    ? `找到 ${tabs.length} 个标签`
    : `${data.tabs.length} 个标签 · 点右侧收纳`;

  if (!tabs.length) {
    showEmpty('没有匹配的标签页', '换个关键词试试。');
    return;
  }

  const map = new Map();
  for (const t of tabs) {
    const key = siteKeyOf(t.url);
    if (!map.has(key)) map.set(key, []);
    map.get(key).push(t);
  }
  const groups = [...map.entries()]
    .map(([site, arr]) => ({
      key: 'site:' + site,
      label: site,
      icon: arr[0].favIconUrl || '',
      // 当前页所在的站点排最前：你打开面板时多半就是想看它周围的标签
      hasActive: arr.some((t) => t.active),
      items: arr.sort(
        (x, y) =>
          Number(y.active) - Number(x.active) ||
          Number(y.pinned) - Number(x.pinned) ||
          x.title.localeCompare(y.title)
      )
    }))
    .sort(
      (a, b) =>
        Number(b.hasActive) - Number(a.hasActive) ||
        b.items.length - a.items.length ||
        a.label.localeCompare(b.label)
    );

  paintGroups(groups, 'tabs');
}

/* ---- 分组渲染 ---- */

function paintGroups(groups, mode) {
  const list = $('#list');
  list.replaceChildren();
  $('#empty').hidden = true;
  const kw = ui.keyword.trim();

  for (const g of groups) {
    const collapsed = ui.collapsed.has(g.key);

    const head = document.createElement('div');
    head.className = 'group-head';
    head.dataset.groupKey = g.key;

    const chev = svgIcon('M9 6l6 6-6 6', 12);
    chev.classList.add('chev');
    if (!collapsed) chev.style.transform = 'rotate(90deg)';
    head.append(chev);

    if (g.icon) {
      const img = document.createElement('img');
      img.className = 'group-favicon';
      img.src = g.icon;
      img.alt = '';
      head.append(img);
    }

    // 标签组用颜色点打头，颜色本身就是这个维度的主要信息
    if (g.dot) {
      const dot = document.createElement('i');
      dot.className = 'group-dot';
      dot.style.background = g.dot;
      head.append(dot);
    }

    const label = document.createElement('span');
    label.className = 'group-label';
    label.textContent = g.label;
    head.append(label);

    const count = document.createElement('span');
    count.className = 'group-count';
    count.textContent = String(g.items.length);
    head.append(count);

    if (mode === 'tabs' && g.items.length > 1) {
      const bulk = document.createElement('button');
      bulk.className = 'link bulk';
      bulk.dataset.act = 'stash-site';
      bulk.dataset.ids = g.items.map((t) => t.id).join(',');
      bulk.textContent = `收这 ${g.items.length} 个`;
      head.append(bulk);
    }

    list.append(head);
    if (collapsed) continue;

    for (const it of g.items) {
      list.append(mode === 'drawer' ? buildDrawerItem(it, kw) : buildTabItem(it, kw));
    }
  }
}

function faviconOf(item) {
  if (item.favIconUrl) {
    const img = document.createElement('img');
    img.className = 'favicon';
    img.src = item.favIconUrl;
    img.alt = '';
    img.addEventListener('error', () => img.replaceWith(avatarOf(item)));
    return img;
  }
  return avatarOf(item);
}

function avatarOf(item) {
  const span = document.createElement('span');
  span.className = 'avatar';
  span.textContent = (hostOf(item.url)[0] || '?').toUpperCase();
  return span;
}

function buildDrawerItem(item, kw) {
  const row = document.createElement('div');
  row.className = 'item';
  row.dataset.act = 'restore';
  row.dataset.id = item.id;
  row.title = `${item.title}\n${item.url}\n点击取回`;

  row.append(faviconOf(item));

  const meta = document.createElement('div');
  meta.className = 'meta';

  const t = document.createElement('div');
  t.className = 'item-title';
  t.append(highlighted(item.title, kw));

  // 分组维度上已经写过的信息，条目里不再重复一遍：
  // 按站点分组时域名是冗余的，按标签组分组时组名是冗余的。
  const showHost = ui.groupBy !== 'site';
  const showGroup = ui.groupBy !== 'group' && !!item.group;

  if (showHost || showGroup) {
    const sub = document.createElement('div');
    sub.className = 'item-host';
    if (showHost) sub.textContent = hostOf(item.url);
    if (showGroup) sub.append(groupChip(item.group));
    meta.append(t, sub);
  } else {
    meta.append(t);
  }

  row.append(meta);

  const del = document.createElement('button');
  del.className = 'del';
  del.dataset.act = 'delete';
  del.dataset.id = item.id;
  del.title = '从抽屉删除';
  del.textContent = '×';
  row.append(del);

  return row;
}

function groupChip(group) {
  const wrap = document.createElement('span');
  wrap.className = 'group-chip';
  const dot = document.createElement('i');
  dot.className = 'dot';
  dot.style.background = GROUP_COLORS[group.color] || GROUP_COLORS.grey;
  const name = document.createElement('span');
  name.textContent = group.title || '未命名组';
  wrap.append(dot, name);
  return wrap;
}

function buildTabItem(tab, kw) {
  const row = document.createElement('div');
  row.className = 'item';
  row.dataset.act = 'focus';
  row.dataset.id = tab.id;
  row.title = `${tab.title}\n${tab.url}` + (tab.active ? '\n（当前页，收纳会关掉它）' : '\n点击跳转到这个标签');

  row.append(faviconOf(tab));

  const meta = document.createElement('div');
  meta.className = 'meta';

  const t = document.createElement('div');
  t.className = 'item-title';
  t.append(highlighted(tab.title, kw));
  meta.append(t);

  // 域名已经在分组标题上写过了，这里只补真正有信息量的状态
  const badges = [];
  if (tab.active) badges.push(tag('当前页', 'on'));
  if (tab.pinned) badges.push(tag('固定'));
  if (tab.discarded) badges.push(tag('已休眠'));
  if (tab.group) badges.push(groupChip(tab.group));

  if (badges.length) {
    const sub = document.createElement('div');
    sub.className = 'item-host';
    for (const b of badges) sub.append(b);
    meta.append(sub);
  }

  row.append(meta);

  const act = document.createElement('button');
  act.className = 'act-btn';
  act.dataset.act = 'stash-tab';
  act.dataset.id = tab.id;
  act.title = tab.active ? '收纳并关闭这个标签' : '收进抽屉';
  act.textContent = '收纳';
  row.append(act);

  return row;
}

function tag(text, kind) {
  const span = document.createElement('span');
  span.className = 'tag' + (kind ? ' ' + kind : '');
  span.textContent = text;
  return span;
}

function showEmpty(title, desc) {
  $('#list').replaceChildren();
  $('#empty').hidden = false;
  $('#emptyTitle').textContent = title;
  $('#emptyDesc').textContent = desc;
}

/* ================= 6. 数据刷新 ================= */

async function refresh() {
  try {
    const res = await api.getState();
    if (!res || res.ok === false) {
      toast('读取失败，请重开面板');
      return;
    }
    data.collection = res.collection || [];
    data.settings = { ...data.settings, ...(res.settings || {}) };
    data.tabCount = res.tabCount ?? data.tabCount;
    data.stashableCount = res.stashableCount ?? 0;
    data.suspendedCount = res.suspendedCount ?? 0;

    // 面板记住上次用的分组方式（除非本次是带 #site / #group 打开的调试视图）
    if (!HASH_MODE && ['time', 'site', 'group'].includes(data.settings.groupBy)) {
      ui.groupBy = data.settings.groupBy;
    }

    if (ui.tab === 'tabs') await loadTabs();
    render();
    syncSettingsUI();
  } catch (err) {
    toast('连接后台失败：' + err.message);
  }
}

async function loadTabs() {
  try {
    const res = await api.getWindowTabs();
    if (res && res.ok) data.tabs = res.tabs || [];
  } catch (_) {
    data.tabs = [];
  }
}

function syncSettingsUI() {
  $('#autoSuspend').checked = !!data.settings.autoSuspend;
  $('#idleMinutes').value = String(data.settings.idleMinutes);
  $('#skipPinned').checked = !!data.settings.skipPinned;
  $('#skipAudible').checked = !!data.settings.skipAudible;
  $('#rebuildGroups').checked = !!data.settings.rebuildGroups;
  $('#lazyRestore').checked = data.settings.lazyRestore !== false;
  $('#restoreInNewWindow').checked = !!data.settings.restoreInNewWindow;
}

/** 取回结果的提示语：说清"冻结"了几个，否则用户会以为标签坏了 */
function restoreToast(res) {
  if (!res || res.ok === false) return toast('取回失败：' + (res && res.error));
  if (!res.count) return toast('没能取回，页面可能被拦截了');
  if (res.count === 1) return toast('已取回，标签已切过去');
  const parts = [`已取回 ${res.count} 个`];
  if (res.frozen) parts.push(`${res.frozen} 个已冻结，点开才加载`);
  if (res.slow) parts.push(`${res.slow} 个太慢没敢冻结，正在加载`);
  if (res.failed) parts.push(`${res.failed} 个失败`);
  toast(parts.join('，'));
}

  const res = await api.stashWindow();
  if (res && res.demo) return toast('预览模式：装进浏览器才会真的收纳');
  if (!res || res.ok === false) return toast('收纳失败：' + (res && res.error));
  if (res.count === 0) return toast('这些标签都已经在抽屉里了');
  toast(`已收进 ${res.count} 个标签` + (res.skipped ? `，跳过重复 ${res.skipped} 个` : ''));
  refresh();
});

$('#btnSuspend').addEventListener('click', async () => {
  const res = await api.suspendAll();
  if (res && res.demo) return toast('预览模式：装进浏览器才会真的休眠');
  if (!res || res.ok === false) return toast('操作失败');
  toast(res.count ? `已休眠 ${res.count} 个后台标签` : '没有可休眠的后台标签');
  refresh();
});

// --- 列表：一个委托搞定所有行内操作 ---
$('#list').addEventListener('click', async (e) => {
  const actEl = e.target.closest('[data-act]');

  // 站点组头的"收这 N 个"
  if (actEl && actEl.dataset.act === 'stash-site') {
    e.stopPropagation();
    const ids = actEl.dataset.ids.split(',').map(Number);
    const res = await api.stashTabs(ids);
    if (res && res.demo) return toast('预览模式：装进浏览器才会真的收纳');
    toast(`已收进 ${res.count} 个标签`);
    return refresh();
  }

  // 单个标签收纳
  if (actEl && actEl.dataset.act === 'stash-tab') {
    e.stopPropagation();
    const res = await api.stashTabs([Number(actEl.dataset.id)]);
    if (res && res.demo) return toast('预览模式：装进浏览器才会真的收纳');
    toast(res.count ? '已收进 1 个标签' : '已在抽屉里了');
    return refresh();
  }

  // 从抽屉删除
  if (actEl && actEl.dataset.act === 'delete') {
    e.stopPropagation();
    const res = await api.remove([actEl.dataset.id]);
    if (res && res.demo) return toast('预览模式：不会真的删除');
    return refresh();
  }

  // 点分组标题：折叠 / 展开
  const head = e.target.closest('.group-head');
  if (head) {
    const key = head.dataset.groupKey;
    if (ui.collapsed.has(key)) ui.collapsed.delete(key);
    else ui.collapsed.add(key);
    return render();
  }

  // 点抽屉条目：取回。单个取回会直接切过去，所以顺手把面板关掉
  if (actEl && actEl.dataset.act === 'restore') {
    const res = await api.restore([actEl.dataset.id]);
    if (res && res.demo) return toast('预览模式：装进浏览器才能真的取回');
    restoreToast(res);
    await refresh();
    if (res && res.ok !== false) window.close();
    return;
  }

  // 点标签条目：跳过去
  if (actEl && actEl.dataset.act === 'focus') {
    const res = await api.focusTab(Number(actEl.dataset.id));
    if (res && res.demo) return toast('预览模式：装进浏览器才能跳转');
    window.close();
  }
});

$('#btnRestoreAll').addEventListener('click', async () => {
  const ids = data.collection.map((i) => i.id);
  if (!ids.length) return;
  // 几十个标签要跑一会儿（并发 3 + 每批等提交），按钮得给出反馈
  const btn = $('#btnRestoreAll');
  const label = btn.textContent;
  btn.disabled = true;
  btn.textContent = '取回中…';
  try {
    const res = await api.restore(ids);
    if (res && res.demo) return toast('预览模式：装进浏览器才能真的取回');
    restoreToast(res);
  } finally {
    btn.disabled = false;
    btn.textContent = label;
  }
  refresh();
});

// 清空是不可逆操作：不用 confirm()（弹窗里弹系统对话框容易把面板一起关掉），
// 改成按钮二次确认——点一次变成"确认清空"，3 秒内再点一次才执行。
let clearArmed = false;
let clearTimer = null;
const clearBtn = $('#btnClear');

function disarmClear() {
  clearArmed = false;
  clearTimer = null;
  clearBtn.textContent = '清空';
  clearBtn.classList.remove('armed');
}

clearBtn.addEventListener('click', async () => {
  if (!data.collection.length) return;
  if (!clearArmed) {
    clearArmed = true;
    clearBtn.textContent = `确认清空 ${data.collection.length} 项？`;
    clearBtn.classList.add('armed');
    clearTimer = setTimeout(disarmClear, 3000);
    return;
  }
  clearTimeout(clearTimer);
  const res = await api.clear();
  disarmClear();
  if (res && res.demo) return toast('预览模式：不会真的清空');
  toast('抽屉已清空');
  refresh();
});

$('#q').addEventListener('input', (e) => {
  ui.keyword = e.target.value;
  render();
});

$('#btnSettings').addEventListener('click', (e) => {
  const panel = $('#settings');
  panel.hidden = !panel.hidden;
  e.currentTarget.classList.toggle('on', !panel.hidden);
});

for (const id of ['autoSuspend', 'skipPinned', 'skipAudible', 'rebuildGroups', 'lazyRestore', 'restoreInNewWindow']) {
  $('#' + id).addEventListener('change', async (e) => {
    await api.saveSettings({ [id]: e.target.checked });
    data.settings[id] = e.target.checked;
  });
}

$('#idleMinutes').addEventListener('change', async (e) => {
  const v = Number(e.target.value);
  await api.saveSettings({ idleMinutes: v });
  data.settings.idleMinutes = v;
});

/* ================= 8. 启动 ================= */

// 调试用：带 #settings 直接展开设置面板，方便截图核对
if (HASH.includes('settings')) {
  $('#settings').hidden = false;
  $('#btnSettings').classList.add('on');
}

refresh();

  </script>
